<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DirkMhob | Forgot Password</title>
  <style>
    :root { --primary:#0077c8; --secondary:#ff6b35; --bg:#f8fafc; --surface:#fff; --text:#0f172a; --muted:#64748b; --border:#e2e8f0; --success:#16a34a; --error:#ef4444; }
    * { box-sizing:border-box; margin:0; padding:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif; }
    body { min-height:100vh; background:linear-gradient(135deg,#f8fbff 0%,#eef4ff 100%); color:var(--text); }
    a { color:inherit; text-decoration:none; }
    .site-header { position:sticky; top:0; z-index:20; background:rgba(248,250,252,0.95); backdrop-filter:blur(12px); border-bottom:1px solid rgba(226,232,240,0.8); }
    .container { width:min(1200px, calc(100% - 2rem)); margin:0 auto; }
    .navbar { display:flex; justify-content:space-between; align-items:center; padding:1rem 0; gap:1rem; }
    .brand { display:flex; align-items:center; gap:.75rem; font-weight:800; font-size:1.1rem; }
    .brand-mark { width:42px; height:42px; display:inline-flex; align-items:center; justify-content:center; border-radius:14px; color:#fff; background:linear-gradient(135deg,var(--primary),var(--secondary)); box-shadow:0 10px 25px rgba(0,119,200,.25); }
    .nav-links { display:flex; gap:1rem; color:var(--muted); font-weight:600; }
    .nav-links a:hover { color:var(--primary); }

    .page { display:flex; align-items:center; justify-content:center; min-height:calc(100vh - 84px); padding:2rem 0; }
    .card { background:var(--surface); border:1px solid var(--border); border-radius:28px; padding:2.25rem; box-shadow:0 20px 50px rgba(15,23,42,.08); width:min(440px, 100%); }

    .step-indicator { display:flex; gap:.5rem; margin-bottom:1.6rem; }
    .step-dot { flex:1; height:4px; border-radius:4px; background:var(--border); transition:background .3s; }
    .step-dot.active { background:var(--primary); }
    .step-dot.done   { background:#86efac; }

    .card-icon { font-size:2.4rem; margin-bottom:.75rem; text-align:center; }
    .card h2   { font-size:1.45rem; margin-bottom:.3rem; }
    .card .sub { color:var(--muted); margin-bottom:1.4rem; font-size:.95rem; line-height:1.5; }

    .field { display:grid; gap:.45rem; margin-bottom:1rem; }
    .field label { font-size:.82rem; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; }
    .field input { width:100%; border:1px solid var(--border); border-radius:14px; padding:.9rem 1rem; outline:none; font-size:1rem; background:#f8fafc; transition:border-color .2s,box-shadow .2s; }
    .field input:focus { border-color:var(--primary); box-shadow:0 0 0 4px rgba(0,119,200,.12); }

    /* OTP input — big digits */
    .otp-field input { font-size:1.6rem; font-weight:900; letter-spacing:.3em; text-align:center; font-family:monospace; }

    .msg { border-radius:12px; padding:.7rem 1rem; font-size:.88rem; font-weight:600; margin-bottom:.9rem; display:none; }
    .msg.ok  { background:#f0fdf4; color:var(--success); border:1px solid #86efac; }
    .msg.err { background:#fef2f2; color:var(--error);   border:1px solid #fca5a5; }

    .btn { display:flex; align-items:center; justify-content:center; gap:.5rem; width:100%; border:none; border-radius:999px; padding:.95rem; cursor:pointer; font-weight:700; font-size:1rem; transition:transform .2s,box-shadow .2s,opacity .2s; background:linear-gradient(135deg,var(--primary),#005fa0); color:#fff; box-shadow:0 12px 25px rgba(0,119,200,.2); margin-top:.25rem; }
    .btn:hover:not(:disabled) { transform:translateY(-2px); box-shadow:0 16px 30px rgba(0,119,200,.28); }
    .btn:disabled { opacity:.55; cursor:default; }

    .back-link { display:block; text-align:center; margin-top:1.1rem; color:var(--muted); font-size:.9rem; }
    .back-link a { color:var(--primary); font-weight:700; }

    .resend-row { text-align:center; margin-top:.8rem; font-size:.88rem; color:var(--muted); }
    .resend-row button { background:none; border:none; color:var(--primary); font-weight:700; cursor:pointer; font-size:.88rem; }
    .resend-row button:disabled { color:var(--muted); cursor:default; }

    @media (max-width:620px) { .nav-links { display:none; } .card { padding:1.4rem; } }
  </style>
</head>
<body>

<header class="site-header">
  <div class="container navbar">
    <a class="brand" href="home_screen.html"><img src="logo.png" alt="DirkMhob" style="height:44px;width:auto;vertical-align:middle;"></a>
    <nav class="nav-links">
      <a href="home_screen.html">Home</a>
      <a href="search_screen.html">Search</a>
      <a href="login.html">Login</a>
    </nav>
  </div>
</header>

<div class="page">
  <div class="card">

    <div class="step-indicator">
      <div class="step-dot active" id="dot-1"></div>
      <div class="step-dot"        id="dot-2"></div>
    </div>

    <!-- ── STEP 1: enter email ── -->
    <div id="step-1">
      <div class="card-icon">🔐</div>
      <h2>Forgot password?</h2>
      <p class="sub">Enter the email address linked to your account and we'll send you a 6-digit reset code.</p>

      <div id="msg-1" class="msg"></div>

      <div class="field">
        <label for="email-input">Email address</label>
        <input id="email-input" type="email" placeholder="you@example.com" autocomplete="email" required />
      </div>

      <button class="btn" id="send-btn" onclick="sendCode()">Send Reset Code</button>

      <p class="back-link">Remembered it? <a href="login.html">Back to login</a></p>
    </div>

    <!-- ── STEP 2: enter OTP + new password ── -->
    <div id="step-2" style="display:none">
      <div class="card-icon">📬</div>
      <h2>Check your email</h2>
      <p class="sub" id="step2-sub">We sent a 6-digit code to <strong id="email-display"></strong>. Enter it below along with your new password.</p>

      <div id="msg-2" class="msg"></div>

      <div class="field otp-field">
        <label for="otp-input">6-digit code</label>
        <input id="otp-input" type="text" inputmode="numeric" maxlength="6" placeholder="000000" autocomplete="one-time-code" />
      </div>
      <div class="field">
        <label for="new-pw">New password</label>
        <input id="new-pw" type="password" placeholder="At least 8 characters" autocomplete="new-password" />
      </div>
      <div class="field">
        <label for="confirm-pw">Confirm new password</label>
        <input id="confirm-pw" type="password" placeholder="Repeat your new password" autocomplete="new-password" />
      </div>

      <button class="btn" id="reset-btn" onclick="resetPassword()">Reset Password</button>

      <div class="resend-row">
        Didn't receive it?
        <button id="resend-btn" onclick="resendCode()" disabled>Resend in <span id="countdown">60</span>s</button>
      </div>
      <p class="back-link"><a href="forgot_password.html">Use a different email</a></p>
    </div>

  </div>
</div>

<script>
  var API = (location.port==='5500'||location.port==='5501') ? 'http://127.0.0.1:8000' : location.origin;
  var savedEmail = '';
  var countdownTimer = null;

  function showMsg(step, type, text) {
    var el = document.getElementById('msg-' + step);
    el.className = 'msg ' + type;
    el.textContent = text;
    el.style.display = 'block';
  }

  function clearMsg(step) {
    var el = document.getElementById('msg-' + step);
    el.style.display = 'none';
  }

  function startCountdown() {
    var btn  = document.getElementById('resend-btn');
    var span = document.getElementById('countdown');
    var secs = 60;
    btn.disabled = true;
    span.textContent = secs;
    clearInterval(countdownTimer);
    countdownTimer = setInterval(function() {
      secs--;
      span.textContent = secs;
      if (secs <= 0) {
        clearInterval(countdownTimer);
        btn.disabled = false;
        btn.textContent = 'Resend code';
      }
    }, 1000);
  }

  function goToStep2() {
    document.getElementById('step-1').style.display = 'none';
    document.getElementById('step-2').style.display = 'block';
    document.getElementById('dot-1').className = 'step-dot done';
    document.getElementById('dot-2').className = 'step-dot active';
    document.getElementById('email-display').textContent = savedEmail;
    startCountdown();
  }

  function sendCode() {
    clearMsg(1);
    var email = document.getElementById('email-input').value.trim();
    if (!email) { showMsg(1, 'err', 'Please enter your email address.'); return; }

    var btn = document.getElementById('send-btn');
    btn.disabled = true;
    btn.textContent = 'Sending…';
    savedEmail = email;

    /* 30-second timeout so Render cold start doesn't hang forever */
    var controller = new AbortController();
    var timer = setTimeout(function() { controller.abort(); }, 30000);

    fetch(API + '/api/password-reset/request/', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: email }),
      signal: controller.signal
    })
    .then(function(r) { clearTimeout(timer); return r.json(); })
    .then(function(d) {
      btn.disabled = false;
      btn.textContent = 'Send Reset Code';
      if (d.error) {
        showMsg(1, 'err', d.error);
      } else {
        goToStep2();
      }
    })
    .catch(function(err) {
      clearTimeout(timer);
      btn.disabled = false;
      btn.textContent = 'Send Reset Code';
      var msg = (err && err.name === 'AbortError')
        ? 'Server is waking up (cold start). Please wait 30 seconds and try again.'
        : 'Could not connect to server. Please try again.';
      showMsg(1, 'err', msg);
    });
  }

  function resendCode() {
    clearMsg(2);
    var btn = document.getElementById('resend-btn');
    btn.disabled = true;
    btn.textContent = 'Resending…';

    fetch(API + '/api/password-reset/request/', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: savedEmail })
    })
    .then(function(r) { return r.json(); })
    .then(function(d) {
      if (d.error) {
        showMsg(2, 'err', d.error);
        btn.disabled = false;
        btn.textContent = 'Resend code';
      } else {
        showMsg(2, 'ok', 'A new code has been sent to ' + savedEmail);
        startCountdown();
      }
    })
    .catch(function() {
      showMsg(2, 'err', 'Could not connect. Please try again.');
      btn.disabled = false;
      btn.textContent = 'Resend code';
    });
  }

  function resetPassword() {
    clearMsg(2);
    var otp      = document.getElementById('otp-input').value.trim();
    var pw       = document.getElementById('new-pw').value;
    var confirm  = document.getElementById('confirm-pw').value;

    if (!otp || otp.length !== 6) { showMsg(2, 'err', 'Please enter the 6-digit code from your email.'); return; }
    if (!pw)                       { showMsg(2, 'err', 'Please enter a new password.'); return; }
    if (pw.length < 8)             { showMsg(2, 'err', 'Password must be at least 8 characters.'); return; }
    if (pw !== confirm)            { showMsg(2, 'err', 'Passwords do not match.'); return; }

    var btn = document.getElementById('reset-btn');
    btn.disabled = true;
    btn.textContent = 'Resetting…';

    fetch(API + '/api/password-reset/confirm/', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: savedEmail, otp: otp, password: pw })
    })
    .then(function(r) { return r.json(); })
    .then(function(d) {
      if (d.error) {
        btn.disabled = false;
        btn.textContent = 'Reset Password';
        showMsg(2, 'err', d.error);
      } else {
        btn.textContent = '✓ Password reset!';
        btn.style.background = 'linear-gradient(135deg,#16a34a,#15803d)';
        showMsg(2, 'ok', 'Your password has been reset successfully. Redirecting to login…');
        setTimeout(function() { window.location.href = 'login.html'; }, 2000);
      }
    })
    .catch(function() {
      btn.disabled = false;
      btn.textContent = 'Reset Password';
      showMsg(2, 'err', 'Could not connect to server. Please try again.');
    });
  }

  /* Allow Enter key to submit */
  document.addEventListener('keydown', function(e) {
    if (e.key !== 'Enter') return;
    if (document.getElementById('step-1').style.display !== 'none') sendCode();
    else resetPassword();
  });
</script>
</body>
</html>
